<h2>Checkout</h2>
<p>Order Summary:</p>

<ul>
    {% for item in cart_items %}
        <li>{{ item.food.name }} x {{ item.quantity }} - Price: {{ item.food.price }} USD</li>
    {% endfor %}
</ul>

<p>Total Price: {{ total_price }} USD</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirm Booking</button>
</form>
