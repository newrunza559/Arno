{% extends 'base.html' %}

{% block title %}Book Room - Hotel Luna{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm p-4">
                <h3 class="mb-3 text-center text-primary">Book Room</h3>

                <div class="mb-4 text-center">
                    <h5 class="fw-bold">{{ room.room_number }} - {{ room.room_type }}</h5>
                    <p>{{ room.description }}</p>
                    <p><strong>Price per night:</strong> {{ room.price_per_night }} Baht</p>
                </div>

                <form method="POST" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="check_in_date" class="form-label">Check-in Date</label>
                        <input type="date" id="check_in_date" name="check_in_date" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="check_out_date" class="form-label">Check-out Date</label>
                        <input type="date" id="check_out_date" name="check_out_date" class="form-control" required>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Confirm Booking</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
